:root{
  --bg:#020617;
  --surface:rgba(8, 22, 45, 0.72);
  --surface-2:rgba(14, 36, 68, 0.62);
  --line:rgba(0, 212, 255, 0.28);
  --text:#f0fbff;
  --muted:#9cc9dd;
  --accent:#00d4ff;
  --accent-2:#00bfff;
  --green:#00e5a0;
  --red:#ff4d6d;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#020617;
    --surface:rgba(8, 22, 45, 0.72);
    --surface-2:rgba(14, 36, 68, 0.62);
    --line:rgba(0, 212, 255, 0.28);
    --text:#f0fbff;
    --muted:#9cc9dd;
    --accent:#00d4ff;
    --accent-2:#00bfff;
  }
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
  -moz-text-size-adjust:100%;
       text-size-adjust:100%;
  width:100%;
  overflow-x:clip;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  width:100%;
  max-width:100vw;
  overflow-x:clip;
}

h1,h2,h3,p{
  overflow-wrap:break-word;
  word-break:normal;
  max-width:100%;
}

.font-display{
  font-family:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  max-width:100%;
}

input,select,textarea{
  outline:none;
  color:var(--text);
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent) !important;
  box-shadow:0 0 0 3px rgba(0,212,255,.22), 0 0 24px rgba(0,212,255,.25);
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:#6f9db2;
}

input::placeholder, textarea::placeholder{
  color:#6f9db2;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.5);
    opacity:.5
  }
}

.live-dot{
  animation:pulseDot 1.2s infinite;
}

@keyframes floatGlow{
  0%,100%{
    transform:translateY(0);
    filter:drop-shadow(0 0 22px rgba(0,212,255,.55))
  }

  50%{
    transform:translateY(-6px);
    filter:drop-shadow(0 0 38px rgba(0,212,255,.85))
  }
}

.logo-float{
  animation:floatGlow 3.2s ease-in-out infinite;
}

@keyframes aurora{
  0%{
    background-position:0% 40%
  }

  50%{
    background-position:100% 60%
  }

  100%{
    background-position:0% 40%
  }
}

.aurora{
  background:radial-gradient(520px 220px at 15% 0%, rgba(0,212,255,.28), transparent 60%), radial-gradient(560px 260px at 90% 12%, rgba(0,102,255,.30), transparent 62%), radial-gradient(420px 220px at 50% 100%, rgba(0,212,255,.13), transparent 60%);
  background-size:180% 180%;
  animation:aurora 9s ease-in-out infinite;
}

.glass{
  background:var(--surface);
  border:1px solid var(--line);
  backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
  width:100%;
  max-width:100%;
  box-sizing:border-box;
}

.neon{
  box-shadow:0 0 0 1px rgba(0,212,255,.45), 0 0 26px rgba(0,212,255,.28), 0 0 58px rgba(0,191,255,.14);
}

.neon-btn{
  background:linear-gradient(135deg,#00d4ff,#0077ff);
  color:#020617;
  box-shadow:0 0 22px rgba(0,212,255,.55), 0 10px 28px rgba(0,119,255,.32);
}

.neon-btn:active{
  transform:scale(.98);
}

.neon-text{
  color:#7beaff;
  text-shadow:0 0 18px rgba(0,212,255,.9), 0 0 42px rgba(0,212,255,.45);
}

@keyframes viz{
  0%,100%{
    transform:scaleY(.28)
  }

  50%{
    transform:scaleY(1)
  }
}

.viz-bar{
  transform-origin:bottom;
  animation:viz .7s ease-in-out infinite;
}

@keyframes scanLine{
  0%{
    top:8%
  }

  100%{
    top:86%
  }
}

.scan-line{
  animation:scanLine 1.8s ease-in-out infinite alternate;
}

@keyframes ringSpin{
  to{
    transform:rotate(360deg)
  }
}

input[type="range"]{
  accent-color:#00d4ff;
}

/* Mobile header: never wrap, never stack letters */

.header-row{
  height:64px;
  min-height:64px;
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:12px;
  box-sizing:border-box;
  width:100%;
  max-width:100vw;
}

.header-brand{
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  white-space:nowrap;
  min-width:0;
}

.header-brand-word{
  white-space:nowrap;
  word-break:normal;
  overflow-wrap:normal;
  font-size:20px;
  line-height:1;
  flex-shrink:0;
}

.header-actions{
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.header-pill{
  display:inline-flex;
  flex-direction:row;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  flex-shrink:0;
  font-size:13px;
  line-height:1.2;
  padding:8px 12px;
}

@media (max-width:359px){
  .header-row{
    padding:8px;
    gap:6px;
  }

  .header-actions{
    gap:6px;
  }

  .header-pill{
    padding:8px;
  }

  .auth-label{
    display:none;
  }

  .header-brand-word{
    font-size:18px;
  }
}

}

  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:inline-flex{
    display: inline-flex;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:h-48{
    height: 12rem;
  }

  .sm\:w-48{

<!-- ===== CONECTA_LIVE - PUENTE A GOOGLE SHEETS - NO BORRA NADA DE LA APP, SOLO AGREGA CONEXION ===== -->
<script>
window.CONECTA_API_URL = "PEGA_AQUI_TU_URL_QUE_TERMINA_EN_/exec";
window.CONECTA_LIVE_DATA = null;
window.CONECTA_MODO = "DEMO";

async function conectaCargarDatos() {
  const url = window.CONECTA_API_URL;
  if (!url || url.includes("PEGA_AQUI")) {
    console.log("Conecta: Aun no hay URL, usando DEMO");
    return null;
  }
  try {
    const res = await fetch(url + "?action=getAll");
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "API error");
    window.CONECTA_LIVE_DATA = data;
    window.CONECTA_MODO = "LIVE";
    console.log("Conecta LIVE conectado:", data);
    // Mostrar aviso visual sin romper nada
    let badge = document.getElementById("conecta-live-badge");
    if (!badge) {
      badge = document.createElement("div");
      badge.id = "conecta-live-badge";
      badge.style.cssText = "position:fixed;top:8px;right:8px;z-index:99999;background:#16a34a;color:#fff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25);font-family:system-ui";
      badge.textContent = "● LIVE • Conecta_LIVE conectado";
      document.body.appendChild(badge);
    }
    // Exponer datos para que cualquier modulo los use
    window.dispatchEvent(new CustomEvent("conecta-live-listo", { detail: data }));
    return data;
  } catch (e) {
    console.error("Conecta LIVE fallo, sigue en DEMO:", e);
    window.CONECTA_MODO = "DEMO";
    return null;
  }
}

async function conectaCrearReserva(datosReserva) {
  const url = window.CONECTA_API_URL;
  if (!url || url.includes("PEGA_AQUI")) { alert("Primero pega tu URL en CONECTA_API_URL"); return null; }
  const res = await fetch(url, { method: "POST", body: JSON.stringify({ action: "crearReserva", data: datosReserva }) });
  return await res.json();
}
async function conectaActualizarReserva(id, estado, conductor_id) {
  const url = window.CONECTA_API_URL;
  const res = await fetch(url, { method: "POST", body: JSON.stringify({ action: "actualizarReserva", id, estado, conductor_id }) });
  return await res.json();
}

// Cargar al abrir, sin bloquear la app si falla
document.addEventListener("DOMContentLoaded", () => { conectaCargarDatos(); });
</script>
<!-- ===== FIN PUENTE CONECTA_LIVE ===== -->
